<title>Motos en Venta</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:white;
}

h1{
    text-align:center;
    padding:20px;
}

.container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
}

.card{
    background:#1e293b;
    margin:15px;
    padding:15px;
    border-radius:15px;
    width:300px;
}

.card img{
    width:100%;
    border-radius:10px;
    cursor:pointer;
}

.galeria{
    display:flex;
    margin-top:10px;
    gap:5px;
}

.galeria img{
    width:60px;
    height:40px;
    object-fit:cover;
    cursor:pointer;
    border-radius:5px;
    opacity:0.7;
}

.galeria img:hover{
    opacity:1;
    border:2px solid #22c55e;
}

.precio{
    color:#22c55e;
    font-size:20px;
    font-weight:bold;
}

.btn{
    display:block;
    margin-top:10px;
    padding:10px;
    text-align:center;
    background:#25D366;
    color:white;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;
}

/* 🔥 ZOOM */
.modal{
    display:none;
    position:fixed;
    z-index:999;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
    justify-content:center;
    align-items:center;
}

.modal img{
    max-width:90%;
    max-height:90%;
    border-radius:10px;
}
</style>

<script>
function cambiarImagen(id, nueva){
    document.getElementById(id).src = nueva;
}

function abrirZoom(src){
    document.getElementById("modal").style.display = "flex";
    document.getElementById("imgZoom").src = src;
}

function cerrarZoom(){
    document.getElementById("modal").style.display = "none";
}
</script>

</head>
