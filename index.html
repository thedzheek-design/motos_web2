<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Motos disponibles</title>

<style>
body{
margin:0;
background:#0f172a;
font-family:Arial;
color:white;
}

h1{
text-align:center;
padding:20px;
}

.container{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
gap:15px;
padding:20px;
}

.card{
background:#1e293b;
border-radius:12px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,0.4);
transition:0.2s;
}

.card:hover{
transform:translateY(-3px);
}

.card img{
width:100%;
height:160px;
object-fit:cover;
cursor:pointer;
}

.info{
padding:10px;
}

.titulo{
font-size:16px;
font-weight:bold;
}

.precio{
color:#22c55e;
font-size:18px;
font-weight:bold;
}

.detalles{
font-size:13px;
color:#cbd5e1;
}

.btn{
display:block;
background:#25D366;
text-align:center;
padding:8px;
margin-top:8px;
border-radius:6px;
text-decoration:none;
color:white;
font-weight:bold;
}

#zoom{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
display:none;
justify-content:center;
align-items:center;
}

#zoom img{
max-width:90%;
max-height:90%;
}
</style>

</head>

<body>

<h1>🔥 Motos Disponibles</h1>

<div class="container" id="motos"></div>

<div id="zoom" onclick="cerrarZoom()">
<img id="imgZoom">
</div>

<script>

fetch("motos.json")
.then(r=>r.json())
.then(data=>{

let cont=document.getElementById("motos")

data.forEach(m=>{

let img = m.fotos && m.fotos.length ? m.fotos[0] : ""

cont.innerHTML+=`
<div class="card">

<img src="${img}" onclick="zoom('${img}')">

<div class="info">

<div class="titulo">
${m.marca} ${m.modelo}
</div>

<div class="precio">
$${m.precio}
</div>

<div class="detalles">
${m.kilometraje || ""} km
</div>

<div class="detalles">
${m.descripcion || ""}
</div>

<a class="btn"
href="https://wa.me/521TU_NUMERO?text=Me interesa la ${m.marca} ${m.modelo}">
WhatsApp
</a>

</div>
</div>
`

})

})

function zoom(src){
document.getElementById("zoom").style.display="flex"
document.getElementById("imgZoom").src=src
}

function cerrarZoom(){
document.getElementById("zoom").style.display="none"
}

</script>

</body>
</html>
