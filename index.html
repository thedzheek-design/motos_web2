<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Motos Marketplace</title>

<style>

body{
margin:0;
background:#0f172a;
font-family:Arial;
color:white;
}

h1{
text-align:center;
padding:20px;
}

.container{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
gap:18px;
padding:20px;
}

.card{
background:#1e293b;
border-radius:12px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,0.4);
transition:0.2s;
}

.card:hover{
transform:translateY(-5px);
box-shadow:0 10px 25px rgba(0,0,0,0.6);
}

.imagen-principal{
width:100%;
height:180px;
object-fit:cover;
cursor:pointer;
}

.miniaturas{
display:flex;
gap:4px;
padding:6px;
overflow-x:auto;
}

.miniaturas img{
width:60px;
height:45px;
object-fit:cover;
border-radius:6px;
cursor:pointer;
opacity:0.7;
}

.miniaturas img:hover{
opacity:1;
}

.info{
padding:10px;
}

.titulo{
font-size:15px;
font-weight:bold;
}

.precio{
color:#22c55e;
font-size:20px;
font-weight:bold;
margin-top:4px;
}

.detalles{
font-size:13px;
color:#cbd5e1;
margin-top:3px;
}

.btn{
display:block;
background:#25D366;
text-align:center;
padding:9px;
margin-top:10px;
border-radius:8px;
text-decoration:none;
color:white;
font-weight:bold;
}

#zoom{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
display:none;
justify-content:center;
align-items:center;
z-index:999;
}

#zoom img{
max-width:90%;
max-height:90%;
}

</style>

</head>

<body>

<h1>🔥 Motos Disponibles</h1>

<div class="container" id="motos"></div>

<div id="zoom" onclick="cerrarZoom()">
<img id="imgZoom">
</div>

<script>

fetch("motos.json")
.then(r=>r.json())
.then(data=>{

let cont=document.getElementById("motos")

data.forEach((m,index)=>{

let principal = ""
let mini = ""

if(m.fotos && m.fotos.length){

principal = m.fotos[0]

m.fotos.forEach((f,i)=>{
mini += `<img src="${f}" onclick="cambiar(${index},'${f}')">`
})

}

cont.innerHTML+=`
<div class="card">

<img id="img${index}" class="imagen-principal"
src="${principal}"
onclick="zoom('${principal}')">

<div class="miniaturas">
${mini}
</div>

<div class="info">

<div class="titulo">
${m.marca} ${m.modelo}
</div>

<div class="precio">
$${m.precio}
</div>

<div class="detalles">
${m.kilometraje || ""}
</div>

<div class="detalles">
${m.descripcion || ""}
</div>

<a class="btn"
href="https://wa.me/5217753628200?text=Me interesa la ${m.marca} ${m.modelo}">
💬 WhatsApp
</a>

</div>
</div>
`

})

})

function cambiar(id,src){
document.getElementById("img"+id).src = src
}

function zoom(src){
document.getElementById("zoom").style.display="flex"
document.getElementById("imgZoom").src=src
}

function cerrarZoom(){
document.getElementById("zoom").style.display="none"
}

</script>

</body>
</html>
