<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Motos</title>

<style>
body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
}

.card{
background:#222;
margin:20px;
padding:15px;
border-radius:10px;
}

.galeria img{
width:200px;
margin:5px;
cursor:pointer;
border-radius:8px;
}

#zoom{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
display:none;
justify-content:center;
align-items:center;
}

#zoom img{
width:80%;
}
</style>

</head>

<body>

<h1>Motos disponibles</h1>

<div id="motos"></div>

<div id="zoom" onclick="cerrarZoom()">
<img id="imgZoom">
</div>

<script>

fetch("motos.json")
.then(r=>r.json())
.then(data=>{

let cont = document.getElementById("motos")

data.forEach(m=>{

let fotos=""

m.fotos.forEach(f=>{
fotos+=`<img src="${f}" onclick="zoom('${f}')">`
})

cont.innerHTML+=`
<div class="card">

<h2>${m.marca} ${m.modelo}</h2>

<p>$${m.precio}</p>

<div class="galeria">
${fotos}
</div>

<a href="https://wa.me/521TU_NUMERO?text=Me interesa la ${m.marca} ${m.modelo}">
WhatsApp
</a>

</div>
`

})

})

function zoom(src){
document.getElementById("zoom").style.display="flex"
document.getElementById("imgZoom").src=src
}

function cerrarZoom(){
document.getElementById("zoom").style.display="none"
}

</script>

</body>
</html>
